[project]
name = "dbt-snowflake-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "OlegAleksashov", email = "oleg.aleksashov@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dbt>=2.0.12",
    "snowflake-connector-python[pandas]>=3.12,<6",
    "pyyaml>=6.0",
]

[project.scripts]
dbt-snowflake-pipeline = "dbt_snowflake_pipeline:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
